services:
  db:
    image: postgres:13
    container_name: miroti-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: db_miroti
    ports:
      - "5433:5432"
    volumes:
      - miroti-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  miroti-db-data:
